name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          set -e
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/}"
          [ -n "$VERSION" ] || VERSION=dev
          echo "stamping builds as $VERSION"
          LDF="-s -w -X github.com/lrm-project/lrm/internal/cli.Version=$VERSION"
          build() {
            pkg=$1; name=$2; os=$3; arch=$4; ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDF" -o "dist/${name}_${os}_${arch}${ext}" "./${pkg}"
          }
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              build cmd/lrm lrm "$os" "$arch"
              # Same program, desktop entry point: double-clickable, opens the
              # panel. Separate artifact only because the argv is different.
              build cmd/lrm-desktop lrm_desktop "$os" "$arch"
            done
          done
          cd dist && sha256sum lrm_* > SHA256SUMS.txt && cd ..
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lrm_*
            dist/SHA256SUMS.txt
