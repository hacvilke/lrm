name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + vet + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: scripts must stay executable
        # A script that loses its +x bit fails CI with a bare
        # "Permission denied" (exit 126) that looks nothing like a mode
        # problem. It has happened: an editor or a file copy dropped the
        # bit and `git add -A` committed 100755 -> 100644. Catch it here,
        # where the message says exactly what to run.
        run: |
          fail=0
          for f in scripts/*.sh; do
            [ -e "$f" ] || continue
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is committed as $mode, expected 100755. Fix with: git update-index --chmod=+x $f"
              fail=1
            else
              echo "  ok $f ($mode)"
            fi
          done
          exit $fail

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1
      - name: CLI surface sweep (every command, live daemon)
        run: |
          go build -o /tmp/lrm ./cmd/lrm
          scripts/check-all.sh /tmp/lrm

  build-matrix:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o lrm ./cmd/lrm
